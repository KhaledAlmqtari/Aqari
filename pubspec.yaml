name: real_estate
description: Real Estate Management System using Clean Architecture and GetX.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  sqflite: ^2.4.6
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  sqflite_common_ffi: ^2.4.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icons/android/
